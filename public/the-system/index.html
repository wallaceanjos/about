<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The System — baixe o app</title>
  <meta name="description" content="Melhore seus hábitos. Baixe o The System na Google Play ou na App Store." />
  <meta name="theme-color" content="#06040c" />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The System — melhore seus hábitos" />
  <meta property="og:description" content="Sua rotina vira um RPG. Baixe na Google Play ou na App Store." />
  <meta property="og:image" content="https://wallaceanjos.github.io/about/img/the-system-download.jpg" />
  <meta property="og:url" content="https://wallaceanjos.github.io/about/the-system/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="../img/the-system-icon.webp" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #06040c;
      --ink: #f6f2ff;
      --aura: 122, 59, 255;
      --ring: #a77bff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      min-height: 100svh;
      font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* A academia ao fundo; o degradê escurece as bordas para o texto e os botões lerem bem. */
    .scene {
      position: fixed;
      inset: 0;
      background: url("../img/the-system-bg.webp") center 42% / cover no-repeat var(--bg);
    }
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 45% at 50% 42%, rgba(var(--aura), 0.22), transparent 70%),
        linear-gradient(180deg, rgba(6, 4, 12, 0.6) 0%, rgba(6, 4, 12, 0.12) 28%, rgba(6, 4, 12, 0.2) 62%, rgba(6, 4, 12, 0.88) 100%);
    }

    main {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3.4svh, 34px);
      padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      text-align: center;
    }

    h1 { margin: 0; line-height: 0; }
    .logo { width: min(64vw, 300px, 30svh * 3.32); height: auto; }

    /* O ícone com o halo violeta da arte de referência. */
    .icon {
      position: relative;
      width: min(68vw, 40svh, 340px);
      aspect-ratio: 1;
    }
    .icon::before {
      content: "";
      position: absolute;
      inset: -14%;
      border-radius: 30%;
      background: radial-gradient(closest-side, rgba(var(--aura), 0.55), rgba(var(--aura), 0.18) 60%, transparent);
      filter: blur(14px);
    }
    .icon-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 22%;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(var(--aura), 0.45),
        0 0 36px 4px rgba(var(--aura), 0.55);
    }
    .icon-frame img { width: 100%; height: 100%; display: block; object-fit: cover; transform: scale(1.14); }

    .tagline {
      margin: 0;
      font-size: clamp(18px, 5.4vw, 26px);
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
    }

    .stores {
      display: flex;
      gap: 12px;
      justify-content: center;
      width: min(100%, 440px);
    }
    .store {
      flex: 1 1 0;
      max-width: 214px;
      display: block;
      border-radius: 10px;
      transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1), filter 160ms ease;
    }
    .store img { width: 100%; height: auto; display: block; }
    .store:active { transform: scale(0.96); }
    .store:focus-visible { outline: 3px solid var(--ring); outline-offset: 4px; }
    @media (hover: hover) {
      .store:hover { transform: translateY(-2px); filter: drop-shadow(0 6px 18px rgba(var(--aura), 0.6)); }
    }

    /* Entrada em cascata, de cima para baixo. */
    .rise { animation: rise 600ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .rise:nth-child(2) { animation-delay: 80ms; }
    .rise:nth-child(3) { animation-delay: 160ms; }
    .rise:nth-child(4) { animation-delay: 240ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .rise { animation: none; }
      .store { transition: none; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <main>
    <h1 class="rise">
      <img class="logo" src="../img/the-system-logo.webp" width="900" height="271" alt="The System" />
    </h1>
    <div class="icon rise">
      <div class="icon-frame">
        <img src="../img/the-system-icon.webp" width="720" height="720" alt="" />
      </div>
    </div>
    <p class="tagline rise">Melhore seus hábitos.<br />Baixe agora</p>
    <nav class="stores rise" aria-label="Baixar o The System">
      <a class="store" href="https://play.google.com/store/apps/details?id=com.thesystem.app"
         target="_blank" rel="noopener noreferrer">
        <img src="../img/badge-google-play.png" width="393" height="114" alt="Disponível no Google Play" />
      </a>
      <a class="store" href="https://apps.apple.com/br/app/the-system/id6819947961"
         target="_blank" rel="noopener noreferrer">
        <img src="../img/badge-app-store.png" width="394" height="114" alt="Baixar na App Store" />
      </a>
    </nav>
  </main>
</body>
</html>
